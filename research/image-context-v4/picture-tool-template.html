<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picture annotation</title><style>body{font:16px/1.5 system-ui;margin:24px;background:#f4f1e9;color:#203c35}main{max-width:1500px;margin:auto}pre{white-space:pre-wrap;background:white;padding:18px}button,select,input,textarea{font:inherit;margin:4px;padding:6px}#frame{display:inline-block;position:relative;touch-action:none}img{display:block;max-width:100%;max-height:1000px}#box{display:none;position:absolute;border:3px solid #ab2850;pointer-events:none}textarea{display:block;width:95%;height:55px}#status{background:white;padding:12px}</style><main>
<pre>__MANUAL__</pre><label>Rater ID <input id="who"></label><label>Model/version if applicable <input id="model"></label><label>Page <select id="page"></select></label><label>Category <select id="category"><option>PL</option><option>VE</option><option>FG</option><option>CE</option><option>OT</option></select></label><div id="frame"><img id="scan" alt="Manuscript page"><div id="box"></div></div><p id="coords">Draw a picture box</p><textarea id="note" placeholder="Note"></textarea><button id="record">Record picture</button><button id="complete">Mark page complete</button><button id="reopen">Reopen page</button><button id="export">Export JSON</button><label>Import saved JSON <input id="import" type="file" accept="application/json"></label><p id="status" role="status">No records saved</p><div id="saved"></div></main>
<script>
const tasks=__TASKS__,el=id=>document.getElementById(id);let rows=[],completed=new Set(),region=null,start=null,drag=null;
tasks.forEach((t,i)=>el('page').add(new Option('Page '+(i+1)+' · '+t.task_id,i)));function status(s){el('status').textContent=s;}
function reset(){region=null;el('box').style.display='none';el('coords').textContent='Draw a picture box';}
function page(){reset();const t=tasks[+el('page').value];if(t){el('scan').src=t.image;status(completed.has(t.task_id)?'This page is complete. Reopen to edit.':'Page not marked complete.');}}el('page').onchange=page;page();
const frame=el('frame'),scan=el('scan');function xy(e){const r=scan.getBoundingClientRect();return [Math.max(0,Math.min(r.width,e.clientX-r.left)),Math.max(0,Math.min(r.height,e.clientY-r.top))];}
frame.onpointerdown=e=>{if(!scan.complete||!scan.naturalWidth)return;start=xy(e);drag=null;frame.setPointerCapture(e.pointerId);e.preventDefault();};frame.onpointermove=e=>{if(!start)return;const end=xy(e),r=scan.getBoundingClientRect(),t=tasks[+el('page').value],x=Math.min(start[0],end[0]),y=Math.min(start[1],end[1]),w=Math.abs(start[0]-end[0]),h=Math.abs(start[1]-end[1]);el('box').style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;drag=[x/r.width*t.native_width,y/r.height*t.native_height,w/r.width*t.native_width,h/r.height*t.native_height].map(Math.round);};frame.onpointerup=()=>{if(drag&&drag[2]>0&&drag[3]>0)region=drag;start=null;el('coords').textContent=region?region.join(', '):'Draw a nonempty picture box';};
function render(){el('saved').replaceChildren();rows.forEach((r,i)=>{const p=document.createElement('p');p.textContent=r.page+' · '+r.category+' ';const b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{completed.delete(r.page);rows.splice(i,1);render();};p.append(b);el('saved').append(p);});status(rows.length+' picture boxes; '+completed.size+' pages complete. Export before closing.');}
el('record').onclick=()=>{const t=tasks[+el('page').value];if(!el('who').value.trim()||!region){status('Rater and nonempty picture box required.');return;}if(completed.has(t.task_id)){status('Reopen page before editing.');return;}if(rows.some(r=>r.page===t.task_id&&r.box.join(',')===region.join(','))){status('Duplicate picture rectangle.');return;}rows.push({page:t.task_id,box:region,category:el('category').value,note:el('note').value});reset();el('note').value='';render();};
el('complete').onclick=()=>{if(!el('who').value.trim()){status('Rater required.');return;}completed.add(tasks[+el('page').value].task_id);render();};el('reopen').onclick=()=>{completed.delete(tasks[+el('page').value].task_id);render();};
el('export').onclick=()=>{if(!el('who').value.trim()||!completed.size){status('Rater and at least one complete page required.');return;}const data={schema:'v4.1-picture-boxes',rater_id:el('who').value.trim(),model_version:el('model').value.trim()||null,completed_pages:[...completed],rows};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='picture-boxes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};el('import').onchange=async()=>{try{const d=JSON.parse(await el('import').files[0].text());if(d.schema!=='v4.1-picture-boxes'||!Array.isArray(d.rows)||!Array.isArray(d.completed_pages)||d.rows.some(r=>!tasks.some(t=>t.task_id===r.page))||d.completed_pages.some(p=>!tasks.some(t=>t.task_id===p)))throw Error('Wrong schema or unknown page');rows=d.rows;completed=new Set(d.completed_pages);el('who').value=d.rater_id||'';el('model').value=d.model_version||'';render();}catch(e){status('Import failed: '+e.message);}};
</script></html>
